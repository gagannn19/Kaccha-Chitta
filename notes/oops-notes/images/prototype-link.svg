<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="360" rx="18" fill="#0b1a33"/>
  <text x="40" y="52" font-size="28" font-weight="bold" fill="#ffa31a">Every object has a hidden link</text>
  <rect x="40" y="100" width="300" height="200" rx="14" fill="#123056" stroke="#2bd2ff" stroke-width="3"/>
  <text x="190" y="135" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">dog</text>
  <text x="70" y="180" font-size="19" fill="#7CFC7C" font-family="Menlo, monospace">name: "Tommy"</text>
  <text x="70" y="270" font-size="19" fill="#ffa31a" font-family="Menlo, monospace">[[Prototype]] ●</text>
  <rect x="560" y="100" width="300" height="200" rx="14" fill="#123056" stroke="#ffa31a" stroke-width="3"/>
  <text x="710" y="135" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">animal (prototype)</text>
  <text x="590" y="180" font-size="19" fill="#7CFC7C" font-family="Menlo, monospace">eats: true</text>
  <text x="590" y="215" font-size="19" fill="#7CFC7C" font-family="Menlo, monospace">walk() { ... }</text>
  <line x1="262" y1="264" x2="548" y2="200" stroke="#ffa31a" stroke-width="4"/>
  <polygon points="556,198 538,190 542,210" fill="#ffa31a"/>
  <text x="400" y="215" font-size="17" fill="#cfe3ff" text-anchor="middle">"if I don't have it,</text>
  <text x="400" y="238" font-size="17" fill="#cfe3ff" text-anchor="middle">ask him"</text>
</svg>
