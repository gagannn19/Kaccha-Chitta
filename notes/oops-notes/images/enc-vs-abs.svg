<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="300" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Encapsulation vs Abstraction</text><text x="190" y="92" font-size="19" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Encapsulation</text><text x="540" y="92" font-size="19" fill="#2bd2ff" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Abstraction</text><line x1="36" y1="104" x2="864" y2="104" stroke="#24406b" stroke-width="1"/><text x="40" y="130" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Focus</text><text x="190" y="130" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">HOW the data is protected</text><text x="540" y="130" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">WHAT the user gets to see</text><line x1="36" y1="144" x2="864" y2="144" stroke="#24406b" stroke-width="1"/><text x="40" y="170" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Done with</text><text x="190" y="170" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">#private, getters/setters, closures</text><text x="540" y="170" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">simple public methods, base classes</text><line x1="36" y1="184" x2="864" y2="184" stroke="#24406b" stroke-width="1"/><text x="40" y="210" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Asks</text><text x="190" y="210" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">"who may touch this data?"</text><text x="540" y="210" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">"what does the user need?"</text><line x1="36" y1="224" x2="864" y2="224" stroke="#24406b" stroke-width="1"/><text x="40" y="250" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Example</text><text x="190" y="250" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">medicine capsule 💊</text><text x="540" y="250" font-size="16" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">TV remote 📺</text></svg>