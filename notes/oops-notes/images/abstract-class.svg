<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="340" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">"Abstract" class in JavaScript</text><rect x="40" y="75" width="300" height="112" rx="12" fill="#123056" stroke="#ff5fa2" stroke-width="3"/><text x="190" y="103" font-size="18" fill="#ff5fa2" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="bold">«abstract» Shape</text><line x1="40" y1="115" x2="340" y2="115" stroke="#ff5fa2" stroke-width="2"/><text x="56" y="143" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">+ area()  // throws</text><text x="56" y="170" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">+ show()</text><polygon points="190,198 176,222 204,222" fill="none" stroke="#ffa31a" stroke-width="3"/><line x1="190" y1="222" x2="190" y2="238" stroke="#ffa31a" stroke-width="3"/><line x1="105" y1="238" x2="275" y2="238" stroke="#ffa31a" stroke-width="3"/><line x1="105" y1="238" x2="105" y2="252" stroke="#ffa31a" stroke-width="3"/><line x1="275" y1="238" x2="275" y2="252" stroke="#ffa31a" stroke-width="3"/><rect x="30" y="252" width="150" height="64" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="105" y="278" font-size="17" fill="#4cd964" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="bold">Circle</text><text x="105" y="303" font-size="15" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">area() ✓</text><rect x="200" y="252" width="150" height="64" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="275" y="278" font-size="17" fill="#4cd964" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-weight="bold">Square</text><text x="275" y="303" font-size="15" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">area() ✓</text><text x="390" y="110" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">❌ new Shape()  → Error</text><text x="390" y="140" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">✅ new Circle(2)</text><text x="390" y="190" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">A promise 📝: every shape WILL have area()</text><text x="390" y="220" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Blocked with new.target in the constructor;</text><text x="390" y="244" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">a missing area() throws at RUN time.</text><text x="390" y="284" font-size="16" fill="#2bd2ff" text-anchor="start" font-family="Helvetica, Arial, sans-serif">TypeScript abstract → checked at compile time</text></svg>