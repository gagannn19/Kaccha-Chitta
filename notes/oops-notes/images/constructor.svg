<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="260" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">constructor = the welcome kit 🎁 every new object gets</text><rect x="36" y="80" width="260" height="120" rx="12" fill="#123056" stroke="#ffa31a" stroke-width="3"/><text x="166.0" y="112" font-size="19" fill="#ffa31a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Default params</text><text x="166.0" y="142" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">constructor(</text><text x="166.0" y="165" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">brand = "Unknown")</text><rect x="320" y="80" width="260" height="120" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="450.0" y="112" font-size="19" fill="#2bd2ff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Class fields</text><text x="450.0" y="142" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">age = 26;</text><text x="450.0" y="165" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">speed = 0;</text><rect x="604" y="80" width="260" height="120" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="734.0" y="112" font-size="19" fill="#4cd964" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Static factory</text><text x="734.0" y="142" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">Car.from(otherCar)</text><text x="734.0" y="165" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">Car.fromJSON(json)</text><text x="36" y="235" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Only ONE constructor per class · runs automatically on new · sets up the object's starting values</text></svg>