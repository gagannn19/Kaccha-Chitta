<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="320" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Polymorphism = one name, many forms 🎭</text><rect x="330" y="70" width="240" height="46" rx="12" fill="#123056" stroke="#ffa31a" stroke-width="3"/><text x="450" y="100" font-size="18" fill="#ffa31a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Polymorphism in JS</text><line x1="400" y1="118" x2="170" y2="150" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="118" x2="450" y2="150" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><line x1="500" y1="118" x2="730" y2="150" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><rect x="36" y="152" width="268" height="110" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="170.0" y="184" font-size="19" fill="#4cd964" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Overriding ✅</text><text x="170.0" y="214" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">child replaces a parent</text><text x="170.0" y="237" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">method, picked at run time</text><rect x="316" y="152" width="268" height="110" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="450.0" y="184" font-size="19" fill="#4cd964" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Duck typing ✅</text><text x="450.0" y="214" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">any object that has the</text><text x="450.0" y="237" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">method can be used</text><rect x="596" y="152" width="268" height="110" rx="12" fill="#123056" stroke="#ff5fa2" stroke-width="3"/><text x="730.0" y="184" font-size="19" fill="#ff5fa2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Overloading ❌</text><text x="730.0" y="214" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">last definition wins →</text><text x="730.0" y="237" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">use default / rest params</text><text x="36" y="300" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">You are one person: a son at home, a student in college. Same you, different behaviour 😄</text></svg>