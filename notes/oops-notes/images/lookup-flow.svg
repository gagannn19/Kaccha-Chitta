<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" rx="18" fill="#0b1a33"/>
  <text x="40" y="50" font-size="28" font-weight="bold" fill="#ffa31a">How JS finds  obj.prop</text>
  <g font-size="19" text-anchor="middle">
    <rect x="300" y="80" width="300" height="56" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/>
    <text x="450" y="115" fill="#fff">Look in obj itself</text>
    <rect x="300" y="190" width="300" height="56" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/>
    <text x="450" y="225" fill="#fff">Found?</text>
    <rect x="640" y="190" width="220" height="56" rx="12" fill="#14532d" stroke="#7CFC7C" stroke-width="3"/>
    <text x="750" y="225" fill="#fff">✅ Return value</text>
    <rect x="300" y="300" width="300" height="56" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/>
    <text x="450" y="335" fill="#fff">Go to obj's prototype</text>
    <rect x="300" y="410" width="300" height="56" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/>
    <text x="450" y="445" fill="#fff">Prototype is null?</text>
    <rect x="640" y="410" width="220" height="56" rx="12" fill="#5b1a1a" stroke="#ff6b6b" stroke-width="3"/>
    <text x="750" y="445" fill="#fff">❌ undefined</text>
  </g>
  <g stroke="#ffa31a" stroke-width="3" fill="none">
    <line x1="450" y1="136" x2="450" y2="186"/>
    <line x1="600" y1="218" x2="636" y2="218"/>
    <line x1="450" y1="246" x2="450" y2="296"/>
    <line x1="450" y1="356" x2="450" y2="406"/>
    <line x1="600" y1="438" x2="636" y2="438"/>
    <path d="M300 438 H120 V108 H296"/>
  </g>
  <g font-size="16" fill="#ffa31a">
    <text x="606" y="210">yes</text><text x="460" y="278">no</text>
    <text x="606" y="430">yes</text><text x="130" y="280">no → repeat</text><text x="130" y="300">with prototype</text>
  </g>
</svg>
