<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="340" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Shallow copy vs Deep copy</text><text x="36" y="92" font-size="20" fill="#ff5fa2" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="bold">Shallow: { ...s1 }</text><rect x="36" y="110" width="150" height="44" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="111" y="138" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">s1.marks</text><rect x="36" y="180" width="150" height="44" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="111" y="208" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">copy.marks</text><rect x="250" y="140" width="170" height="54" rx="12" fill="#123056" stroke="#ff5fa2" stroke-width="3"/><text x="335" y="173" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">{ math: 90 }</text><line x1="186" y1="132" x2="246" y2="158" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><line x1="186" y1="202" x2="246" y2="178" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><text x="36" y="262" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">nested object is SHARED:</text><text x="36" y="286" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">change copy → s1 changes too 😱</text><text x="474" y="92" font-size="20" fill="#4cd964" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="bold">Deep: structuredClone(s1)</text><rect x="474" y="110" width="150" height="44" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="549" y="138" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">s1.marks</text><rect x="474" y="180" width="150" height="44" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="549" y="208" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">copy.marks</text><rect x="690" y="110" width="170" height="44" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="775" y="138" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">{ math: 90 }</text><rect x="690" y="180" width="170" height="44" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="775" y="208" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">{ math: 90 }</text><line x1="624" y1="132" x2="686" y2="132" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><line x1="624" y1="202" x2="686" y2="202" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><text x="474" y="262" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">every level is copied:</text><text x="474" y="286" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">each has its own data ✅</text><text x="36" y="322" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Shallow = sharing one Google Doc link · Deep = downloading your own copy</text></svg>