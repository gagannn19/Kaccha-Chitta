<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="300" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Abstraction = hide complexity, show what matters</text><text x="36" y="92" font-size="20" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">What you use</text><rect x="36" y="108" width="360" height="140" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="60" y="145" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">fetch(url)</text><text x="60" y="180" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">arr.sort()</text><text x="60" y="215" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">machine.makeCoffee()</text><text x="450" y="92" font-size="20" fill="#ff5fa2" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">What stays hidden</text><rect x="450" y="108" width="414" height="140" rx="12" fill="#123056" stroke="#ff5fa2" stroke-width="3"/><text x="472" y="145" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">DNS, TCP, HTTP, caching...</text><text x="472" y="180" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">the sorting algorithm</text><text x="472" y="215" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">#boilWater(), #grindBeans()</text><text x="36" y="282" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">You use a TV remote 📺 or an ATM 🏧 without knowing the circuits inside</text></svg>