<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="330" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Overloading vs Overriding in JavaScript</text><rect x="36" y="75" width="400" height="225" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="56" y="108" font-size="19" fill="#2bd2ff" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Overloading (same class)</text><text x="56" y="145" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">add(a, b) { ... }</text><text x="56" y="172" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">add(a, b, c) { ... }</text><text x="56" y="199" font-size="15" fill="#ff5fa2" text-anchor="start" font-family="Menlo, Consolas, monospace">// ❌ 2nd replaces the 1st</text><text x="56" y="230" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">add(...nums) { ... }</text><text x="56" y="257" font-size="15" fill="#4cd964" text-anchor="start" font-family="Menlo, Consolas, monospace">// ✅ the JS way: one method</text><text x="56" y="284" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">same name, different params</text><rect x="464" y="75" width="400" height="225" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="484" y="108" font-size="19" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Overriding (parent ↔ child)</text><text x="484" y="145" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">Animal: sound() → "..."</text><text x="484" y="172" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">Dog:    sound() → "Woof"</text><text x="484" y="199" font-size="16" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">Cat:    sound() → "Meow"</text><text x="484" y="236" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">same name, same params,</text><text x="484" y="260" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">child changes the behaviour</text><text x="484" y="284" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">needs extends · fully supported ✅</text></svg>