<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="290" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Life of a JS object 🐣 → ♻️</text><rect x="30" y="80" width="146" height="120" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="103.0" y="112" font-size="19" fill="#2bd2ff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">new Car()</text><text x="103.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">object created</text><line x1="177" y1="140" x2="200" y2="140" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><rect x="202" y="80" width="146" height="120" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="275.0" y="112" font-size="19" fill="#4cd964" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">constructor</text><text x="275.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">sets values</text><line x1="349" y1="140" x2="372" y2="140" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><rect x="374" y="80" width="146" height="120" rx="12" fill="#123056" stroke="#ffa31a" stroke-width="3"/><text x="447.0" y="112" font-size="19" fill="#ffa31a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">used</text><text x="447.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">call methods</text><line x1="521" y1="140" x2="544" y2="140" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><rect x="546" y="80" width="146" height="120" rx="12" fill="#123056" stroke="#ffffff" stroke-width="3"/><text x="619.0" y="112" font-size="19" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">unreachable</text><text x="619.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">no variable</text><text x="619.0" y="165" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">points to it</text><line x1="693" y1="140" x2="716" y2="140" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><rect x="718" y="80" width="146" height="120" rx="12" fill="#123056" stroke="#ff5fa2" stroke-width="3"/><text x="791.0" y="112" font-size="19" fill="#ff5fa2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">GC frees it</text><text x="791.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">automatic,</text><text x="791.0" y="165" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">time not fixed</text><text x="36" y="240" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">No destructor in JS ♻️ · clean up timers, listeners, sockets yourself:</text><text x="36" y="264" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">close() + try/finally, removeEventListener, React effect cleanup, using + Symbol.dispose</text></svg>