<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="335" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">this = "who called me?"</text><rect x="36" y="78" width="560" height="230" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="60" y="115" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">user.greet()</text><text x="270" y="115" font-size="17" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">→</text><text x="300" y="115" font-size="17" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif">this = user</text><text x="60" y="157" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">new User()</text><text x="270" y="157" font-size="17" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">→</text><text x="300" y="157" font-size="17" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif">this = the new object</text><text x="60" y="199" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">greet.call(admin)</text><text x="270" y="199" font-size="17" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">→</text><text x="300" y="199" font-size="17" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif">this = admin</text><text x="60" y="241" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">greet()</text><text x="270" y="241" font-size="17" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">→</text><text x="300" y="241" font-size="17" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif">this = undefined (strict mode)</text><text x="60" y="283" font-size="17" fill="#ffffff" text-anchor="start" font-family="Menlo, Consolas, monospace">() =&gt; this</text><text x="270" y="283" font-size="17" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">→</text><text x="300" y="283" font-size="17" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif">this of the outer code</text><text x="625" y="120" font-size="18" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Decided at CALL time,</text><text x="625" y="146" font-size="18" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">not where the function</text><text x="625" y="172" font-size="18" fill="#ffffff" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">is written.</text><text x="625" y="220" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Like the word "my" 🗣️:</text><text x="625" y="244" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">it depends on who</text><text x="625" y="268" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">is speaking.</text></svg>