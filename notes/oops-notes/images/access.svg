<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="270" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Access in a JS class = rooms of a house 🏠</text><rect x="36" y="80" width="260" height="130" rx="12" fill="#123056" stroke="#4cd964" stroke-width="3"/><text x="166.0" y="112" font-size="19" fill="#4cd964" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">public</text><text x="166.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">name</text><text x="166.0" y="165" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">anyone can read</text><text x="166.0" y="188" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">and change it</text><rect x="320" y="80" width="260" height="130" rx="12" fill="#123056" stroke="#ffa31a" stroke-width="3"/><text x="450.0" y="112" font-size="19" fill="#ffa31a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">_convention</text><text x="450.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">_balance</text><text x="450.0" y="165" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">STILL public! just a</text><text x="450.0" y="188" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">"please don't touch" sign</text><rect x="604" y="80" width="260" height="130" rx="12" fill="#123056" stroke="#ff5fa2" stroke-width="3"/><text x="734.0" y="112" font-size="19" fill="#ff5fa2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">#private</text><text x="734.0" y="142" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">#pin</text><text x="734.0" y="165" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">only code inside</text><text x="734.0" y="188" font-size="16" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">the class (engine-enforced)</text><text x="36" y="245" font-size="15" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">No protected keyword in JS · TypeScript adds public / protected / private (compile-time only)</text></svg>