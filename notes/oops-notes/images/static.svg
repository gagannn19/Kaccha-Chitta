<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="270" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">static = shared by the CLASS, not each object</text><rect x="86" y="75" width="300" height="70" rx="12" fill="#123056" stroke="#ffa31a" stroke-width="3"/><text x="236" y="104" font-size="18" fill="#ffa31a" text-anchor="middle" font-family="Menlo, Consolas, monospace">static count = 3</text><text x="236" y="130" font-size="15" fill="#b8c4d6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">ONE copy, lives on Student</text><line x1="180" y1="147" x2="110" y2="184" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><line x1="236" y1="147" x2="236" y2="184" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><line x1="292" y1="147" x2="362" y2="184" stroke="#ffa31a" stroke-width="3" marker-end="url(#ah)"/><rect x="36" y="188" width="120" height="60" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="96.0" y="220" font-size="19" fill="#2bd2ff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">s1</text><rect x="176" y="188" width="120" height="60" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="236.0" y="220" font-size="19" fill="#2bd2ff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">s2</text><rect x="316" y="188" width="120" height="60" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="376.0" y="220" font-size="19" fill="#2bd2ff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">s3</text><text x="470" y="100" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">normal fields: each object has its own</text><text x="470" y="130" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">static: one shared copy, like the</text><text x="470" y="154" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">classroom whiteboard 🧑‍🏫</text><text x="470" y="194" font-size="17" fill="#4cd964" text-anchor="start" font-family="Menlo, Consolas, monospace">Student.getCount()  ✅</text><text x="470" y="224" font-size="17" fill="#ff5fa2" text-anchor="start" font-family="Menlo, Consolas, monospace">s1.count  → undefined</text></svg>