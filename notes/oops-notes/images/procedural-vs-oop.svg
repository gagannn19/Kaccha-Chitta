<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffa31a"/></marker></defs><rect width="900" height="285" rx="18" fill="#0b1a33"/><text x="36" y="50" font-size="28" fill="#ffa31a" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Procedural vs Object-Oriented</text><text x="36" y="95" font-size="21" fill="#ff5fa2" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Procedural</text><rect x="36" y="110" width="390" height="46" rx="12" fill="#123056" stroke="#ff5fa2" stroke-width="3"/><text x="231" y="140" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">let studentName, studentMarks;</text><rect x="36" y="170" width="120" height="44" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="96" y="198" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">add()</text><rect x="171" y="170" width="120" height="44" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="231" y="198" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">calc()</text><rect x="306" y="170" width="120" height="44" rx="12" fill="#123056" stroke="#2bd2ff" stroke-width="3"/><text x="366" y="198" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">print()</text><text x="36" y="250" font-size="16" fill="#b8c4d6" text-anchor="start" font-family="Helvetica, Arial, sans-serif">data and functions live separately</text><text x="474" y="95" font-size="21" fill="#4cd964" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Object-Oriented</text><rect x="474" y="110" width="390" height="104" rx="12" fill="#123056" stroke="#4cd964" 